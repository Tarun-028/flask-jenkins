<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Expense</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f4f4f4;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
        }

        input, select, button {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin: 8px 0;
        }

        button {
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Edit Expense</h1>

        <form action="{{ url_for('edit_expense', id=expense.id) }}" method="POST">

            <label>Description</label>
            <input
                type="text"
                name="title"
                value="{{ expense.title }}"
                required
            >

            <label>Amount</label>
            <input
                type="number"
                name="amount"
                value="{{ expense.amount }}"
                step="0.01"
                min="0"
                required
            >

            <label>Category</label>
            <select name="category" required>
                {% for category in categories %}
                    <option
                        value="{{ category }}"
                        {% if expense.category == category %}selected{% endif %}
                    >
                        {{ category }}
                    </option>
                {% endfor %}
            </select>

            <button type="submit">Save Changes</button>
        </form>

        <a href="{{ url_for('index') }}">← Back to Expenses</a>
    </div>

</body>
</html>
